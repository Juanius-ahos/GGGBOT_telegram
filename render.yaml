# Render Blueprint: free web service built from the Dockerfile.
# Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: soleye
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
